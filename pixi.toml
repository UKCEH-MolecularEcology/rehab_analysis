[workspace]
authors = ["REHAB analysis"]
channels = ["conda-forge", "bioconda"]
name = "rehab-binning"
platforms = ["linux-64"]
version = "0.1.0"

# Scoped to the new multi-binner MAG-generation module only (adapted from
# https://github.com/michoug/MAGsGeneration's pixi.toml -- exact version
# pins reused as-is where the tool is new to this project, since several of
# these aren't plain bioconda packages (vamb/metacat are pip wheels,
# deepmicroclass/remag are PyPI) and this manifest is already validated.
# Everything else in this repo (preprocessing, assembly, taxonomy, amr,
# eggnog, coverage, seed, bgc_amr) stays on its existing conda-based rules
# -- this is additive, not a replacement.
#
# CheckM2 and GTDB-Tk are deliberately NOT included here: this project
# already has both configured against existing databases
# (/hdd0/susbus/databases/CheckM2_database, /hdd0/susbus/databases/gtdbtk)
# via workflow/rules/dereplicate.smk and bin_taxqual.smk -- reused as-is.

[feature.rosella]
channels = ["conda-forge", "numba", "bioconda"]
[feature.rosella.dependencies]
rosella = ">=0.5.7,<1"
umap-learn = "0.5.3.*"
setuptools = "<82"

[feature.vamb]
channels = ["conda-forge", "bioconda"]
[feature.vamb.dependencies]
python = "3.10.*"
[feature.vamb.pypi-dependencies]
vamb = ">=5.0.4"

[feature.comebin]
channels = ["conda-forge", "bioconda"]
[feature.comebin.dependencies]
comebin = ">=1.0.3, <1.1"

[feature.semibin]
channels = ["conda-forge", "bioconda"]
[feature.semibin.dependencies]
semibin = ">=2.3,<2.5"

[feature.metacat]
channels = ["conda-forge", "bioconda"]
[feature.metacat.dependencies]
python = ">=3.12.13,<3.13"
hmmer = ">=3.4,<4"
fraggenescan = ">=1.32,<2"
[feature.metacat.pypi-dependencies]
metacat = { url = "https://github.com/liu-congcong/MetaCAT/releases/download/v1.0.5/metacat-1.0.5-py3-none-any.whl" }

[feature.galah]
channels = ["conda-forge", "bioconda"]
[feature.galah.dependencies]
python = "3.8.*"
galah = "0.4.*"
gsl = { version = "==2.7", build = "he838d99_0" }
dashing = "0.4.*"

[feature.coverm]
channels = ["conda-forge", "bioconda"]
[feature.coverm.dependencies]
coverm = ">=0.7.0,<1"
samtools = "1.*"
strobealign = ">=0.17,<0.20"

[feature.mmseqs]
channels = ["conda-forge", "bioconda"]
[feature.mmseqs.dependencies]
mmseqs2 = "18.*"

[feature.taxconverter]
channels = ["conda-forge", "bioconda"]
[feature.taxconverter.dependencies]
pip = "25.1.1.*"
python = "3.10.17.*"
[feature.taxconverter.pypi-dependencies]
taxconverter = ">=1.1.0"

[feature.deepmicroclass]
channels = ["conda-forge", "bioconda"]
[feature.deepmicroclass.dependencies]
pip = "25.*"
python = "3.10.*"
requests = "2.*"
packaging = "26.*"
[feature.deepmicroclass.pypi-dependencies]
biopython = "==1.85"
deepmicroclass = "==1.0.6.2"

[feature.remag]
channels = ["conda-forge", "bioconda"]
[feature.remag.dependencies]
remag = ">=0.4.0,<1.0.0"

[feature.busco]
channels = ["conda-forge", "bioconda"]
[feature.busco.dependencies]
busco = ">=6,<7"
sepp = "4.5.5.*"

[feature.mgthermometer]
channels = ["conda-forge", "bioconda"]
[feature.mgthermometer.dependencies]
perl-bioperl = "1.7.8.*"
perl-file-slurp = "*"
perl-list-moreutils = "*"

[feature.syntracker]
channels = ["conda-forge", "bioconda"]
[feature.syntracker.dependencies]
python = "3.14.0.*"
r-base = "4.0.5.*"
bioconductor-decipher = "2.18.1.*"
r-tidyverse = "1.3.0.*"
blast = "2.17.0.*"

[feature.annotations]
channels = ["conda-forge", "bioconda"]
[feature.annotations.dependencies]
prodigal = "2.6.3.*"
pyrodigal = ">=3.5,<4"

[feature.multiqc]
channels = ["conda-forge", "bioconda"]
[feature.multiqc.dependencies]
multiqc = ">=1.35,<2"

[environments]
rosella = { features = ["rosella"], no-default-feature = true }
vamb = { features = ["vamb"], no-default-feature = true }
comebin = { features = ["comebin"], no-default-feature = true }
semibin = { features = ["semibin"], no-default-feature = true }
metacat = { features = ["metacat"], no-default-feature = true }
galah = { features = ["galah"], no-default-feature = true }
coverm = { features = ["coverm"], no-default-feature = true }
mmseqs = { features = ["mmseqs"], no-default-feature = true }
taxconverter = { features = ["taxconverter"], no-default-feature = true }
deepmicroclass = { features = ["deepmicroclass"], no-default-feature = true }
remag = { features = ["remag"], no-default-feature = true }
busco = { features = ["busco"], no-default-feature = true }
mgthermometer = { features = ["mgthermometer"], no-default-feature = true }
syntracker = { features = ["syntracker"], no-default-feature = true }
annotations = { features = ["annotations"], no-default-feature = true }
multiqc = { features = ["multiqc"], no-default-feature = true }
