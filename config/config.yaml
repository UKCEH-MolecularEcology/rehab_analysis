############################################################
# STEPS
#
# Available: "preprocessing", "taxonomy", "assembly", "contig_taxonomy", "sylph",
#            "kaiju", "coassembly", "annotation", "amr", "eukaryotes", "cluster",
#            "binning", "coverage", "functions", "seed", "traits",
#            "mgthermometer", "syntracker", "eukaryotic_mags", "bgc", "bgc_families"
#
# mgthermometer, syntracker, bgc, and bgc_families run standard alongside
# binning (all just need the final dereplicated MAGs -- bgc_families needs
# "bgc" to have run first). eukaryotic_mags (MAGsGeneration's
# DeepMicroClass/REMAG/BUSCO-euk eukaryotic bin recovery) stays optional --
# add it to this list only when you want that extra pass over the raw bins.
#
# Start minimal and extend once the data acquisition step (see scripts/) has
# produced config/samples.tsv.
steps: ["preprocessing", "taxonomy", "assembly", "annotation", "coverage", "functions", "amr", "amrscan", "bgc_amr", "binning", "seed", "mgthermometer", "syntracker", "bgc", "bgc_families"]

############################################################
# INPUT

# Directory where this workflow repo lives
work_dir: "/prj/DECODE/rehab"

# Directory where the (concatenated, per-sample) fastq files are
data_dir: "/prj/DECODE/rehab/data/concatenated_fastq"

# Directory for the results
results_dir: "/prj/DECODE/rehab/results"

# Directory where the conda environments are
env_dir: "/prj/DECODE/rehab/workflow/envs"

# Directory with scripts
src_dir: "/prj/DECODE/rehab/workflow/scripts"

# Sample table, generated by scripts/generate_sample_table.sh after download + concatenation
samples: "config/samples.tsv"

############################################################
# TOOLS
# PREPROCESSING
trim_galore:
  threads: 16

quast:
  threads: 8

# FILTERING (human/host read removal)
filter:
  fasta: "/hdd0/susbus/databases/hg38/GRCh38_latest_genomic.fna"

# QUALITY
fastqc:
  threads: 4

# CLASSIFICATION
kraken2:
  db: "/hdd0/susbus/databases/kraken2/pluspfp/"
  confidence: 0.2
  contig_confidence: 0.2
  threads: 12
  read: 150
  level: "S"
  contig_level: "S"

# KAIJU
kaiju:
  threads: 12
  level: "species"
  fmi: "/hdd0/susbus/databases/kaiju/kaiju_db_nr_euk.fmi"
  nodes: "/hdd0/susbus/databases/kaiju/nodes.dmp"
  names: "/hdd0/susbus/databases/kaiju/names.dmp"

struo2_kraken2:
  db: "/hdd0/susbus/databases/kraken2/"
  threads: 12

bracken:
  bin: "/hdd0/susbus/tools/Bracken/bracken"
  combine: "/hdd0/susbus/tools/Bracken/analysis_scripts/combine_bracken_outputs.py"

singlem:
  threads: 16
  # S3.2.1 (2023) is incompatible with the installed SingleM (5.4.0) --
  # matches what /prj/DECODE/socd/results/ags_agc/ags_agc_snakefile.smk
  # found and fixed. Use the same accessible copy (the "official" path at
  # /hdd0/susbus/databases/singlem/S6.5.0... has a payload_directory with
  # no group read access).
  db: "/hdd0/susbus/databases/singlem/susbus_copies/S6.5.0.GTDB_r232.metapackage_20260319.smpkg.zb"

# MEGAHIT
megahit:
  threads: 32
  coassembly_threads: 70

clumpify:
  threads: 64
  dupedist: 12000
  groups: 50
  memory: "1600g"

prodigal:
  threads: 12

eukulele:
  threads: 64
  db: "phylodb"
  aligner: "diamond"
  scratch: "/prj/DECODE/rehab/tmp/eukulele_scratch"
  ref_dir: "/hdd0/susbus/databases"

bwa:
  threads: 16
  map_threads: 16

samtools:
  sort:
    chunk_size: "4G"
    chunk_size_bigmem: "16G"

magiclamp:
  threads: 36

eggnog:
  db: "/hdd0/susbus/databases/eggnog"
  threads: 16
  final_threads: 24
  itype: "proteins"
  genepred: "prodigal"
  split:
    length: 2000000
    suffix: 3

seed:
  db: "/raid1/scratch/MEGshared/MG_packages/samsa2/full_databases"
  dmnd_db: "/raid1/scratch/MEGshared/MG_packages/samsa2/full_databases/subsys_db.dmnd"
  fa_db: "/raid1/scratch/MEGshared/MG_packages/samsa2/full_databases/subsys_db.fa"
  threads: 24

mmseqs2:
  threads: 72
  cov: 0.7
  min_id: 0.5
  cov_mode: 1

# AMR — core to REHAB (antibiotic resistance gene transmission study)
rgi:
  threads: 64
  db_url: "https://card.mcmaster.ca/latest/data"

filter_length:
  threads: 4

mdmcleaner:
  threads: 48

mapping:
  threads: 16

metabat2:
  threads: 56

concoct:
  threads: 64

metabinner:
  length: 2000
  threads: 64

semibin:
  threads: 64
  env: "wastewater"

############################################################
# MAG generation (new multi-binner module, workflow/rules/mags_generation.smk)
# All run via pixi (pixi.toml / scripts/pixi_env.sh), adapted from
# https://github.com/michoug/MAGsGeneration -- see that file's docstring
# for why (several of these aren't plain bioconda packages).
rosella:
  threads: 28

mmseqs_gtdb:
  threads: 20

vamb:
  threads: 14

comebin:
  threads: 20

metacat:
  threads: 20

# Galah dereplication (workflow/rules/dereplicate.smk), replacing dRep for
# the new 7-way binner ensemble -- matches the reference repo's choice.
galah:
  threads: 10
  comp: 70
  cont: 10

dasTool:
  bin: "/hdd0/susbus/tools/DAS_Tool/DAS_Tool"
  threads: 64

checkm:
  threads: 64
  extension: "fa"
  git_path: "https://github.com/chklovski/CheckM2"

drep:
  threads: 64
  comp: 70
  cont: 16

gtdbtk:
  threads: 64
  path: "/hdd0/susbus/databases/gtdbtk/release214"

sylph:
  threads: 48
  gtdb_url: "http://faust.compbio.cs.cmu.edu/sylph-stuff/gtdb-r220-c200-dbv1.syldb"
  imgvr_url: "http://faust.compbio.cs.cmu.edu/sylph-stuff/imgvr_c200_v0.3.0.syldb"
  fundb_url: "http://faust.compbio.cs.cmu.edu/sylph-stuff/fungi-refseq-2024-07-25-c200-v0.3.syldb"

kegg_ids: "ko00521|ko00522|ko00523|ko00311|ko02611|ko01055|ko01051|ko00522"

############################################################
# AMR-marker / growth-rate step (workflow/rules/bgc_amr.smk)
# Adapted from SOCD's singlem_bgc_Snakefile_no_metadata. BGC prediction
# itself (antiSMASH/GECCO/clustering) moved to the MAG level -- see
# workflow/rules/bgc.smk + bgc_families.smk below.

# Curated KEGG KO -> antibiotic biosynthesis/resistance marker reference
abx_bgc:
  kegg_ref: "/prj/DECODE/rehab/resources/kegg_abx_bgc.txt"

seqkit:
  bin: "/home/susbus/miniforge3/bin/seqkit"

############################################################
# Optional MAG-generation modules (workflow/rules/eukaryotes_filter.smk,
# mgthermometer.smk, syntracker.smk)
busco_euk:
  # Reusing the existing BUSCO lineage cache (eukaryota_odb10 already
  # present) rather than a fresh download -- per "check my
  # /hdd0/susbus/databases folder for existing ones" instruction.
  db: "/hdd0/susbus/databases/busco_downloads"

remag:
  threads: 20

############################################################
# BGC prediction on the final dereplicated MAGs (workflow/rules/bgc.smk),
# ported from UKCEH-MolecularEcology/skyline's annotations branch
# (workflow/rules/bgc.smk) -- batched antiSMASH (official container image,
# databases bundled) + GECCO per MAG, with per-MAG pass/fail tracked via a
# STATUS sentinel so a batch-level failure threshold doesn't abort the
# whole run over one bad MAG. Runs on the ~dozens of dereplicated MAGs
# instead of all 147 per-sample assemblies -- the per-sample antiSMASH
# pass this replaced took too long at that scale.
bgc:
  batch_size: 20
  antismash:
    image: "antismash/standalone:8.0.4"
    parallel: 4
    cpus_per_mag: 4
    extra: ""
  gecco:
    bin: "/home/susbus/miniforge3/envs/gecco/bin/gecco"
    parallel: 4
    cpus_per_mag: 4
    extra: ""
  max_failed_frac: 0.05
  overlap_min_bp: 1

# BGC families: BiG-SLiCE 2 on all antiSMASH regions (single job), replacing
# BiG-SCAPE -- also ported from skyline's bgc_families.smk.
bgc_families:
  threshold: 0.4
  threads: 16
  extra: ""
  models_url: "https://github.com/medema-group/bigslice/releases/download/v2.0.0rc/bigslice-models.2022-11-30.tar.gz"
  models_md5: "aaabde911ec107d08e5c24f68aaf31d1"
  # New DB -- per "check my /hdd0/susbus/databases folder for existing
  # ones, new DBs go in that folder too" instruction.
  models_dir: "/hdd0/susbus/databases/bigslice/bigslice-models"

# gRodon2 has no existing conda/native install on this host; runs via
# Singularity (image + temp files under work_dir/containers and work_dir/tmp)
grodon:
  image: "shengwei/grodon2:latest"

############################################################
# amrscan (workflow/rules/amrscan.smk) -- read-based AMR gene/variant
# detection via submodules/snake_amrscan (H.S. Gweon's resscan).
# The pre-existing 'amrscan' conda env has bwa/diamond/samtools but not
# pandas/numpy, so PATH is stitched with the base miniforge3 python (which
# has both) rather than rebuilding either environment.
amrscan:
  threads: 24
  db: "/prj/DECODE/salisbury_plain_results/snake_amrscan/resscan_CARD_v4.0.1"
  python_bin: "/home/susbus/miniforge3/bin/python"
  env_bin: "/prj/DECODE/conda_envs/amrscan/bin"
