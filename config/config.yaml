############################################################
# STEPS
#
# Available: "preprocessing", "taxonomy", "assembly", "contig_taxonomy", "sylph",
#            "kaiju", "coassembly", "annotation", "amr", "eukaryotes", "cluster",
#            "binning", "coverage", "functions", "seed", "traits", "antismash"
#
# Start minimal and extend once the data acquisition step (see scripts/) has
# produced config/samples.tsv.
steps: ["preprocessing", "taxonomy", "assembly", "amr", "amrscan", "bgc_amr"]

############################################################
# INPUT

# Directory where this workflow repo lives
work_dir: "/prj/DECODE/rehab"

# Directory where the (concatenated, per-sample) fastq files are
data_dir: "/prj/DECODE/rehab/data/concatenated_fastq"

# Directory for the results
results_dir: "/prj/DECODE/rehab/results"

# Directory where the conda environments are
env_dir: "/prj/DECODE/rehab/workflow/envs"

# Directory with scripts
src_dir: "/prj/DECODE/rehab/workflow/scripts"

# Sample table, generated by scripts/generate_sample_table.sh after download + concatenation
samples: "config/samples.tsv"

############################################################
# TOOLS
# PREPROCESSING
trim_galore:
  threads: 16

quast:
  threads: 8

# FILTERING (human/host read removal)
filter:
  fasta: "/hdd0/susbus/databases/hg38/GRCh38_latest_genomic.fna"

# QUALITY
fastqc:
  threads: 4

# CLASSIFICATION
kraken2:
  db: "/hdd0/susbus/databases/kraken2/pluspfp/"
  confidence: 0.2
  contig_confidence: 0.2
  threads: 12
  read: 150
  level: "S"
  contig_level: "S"

# KAIJU
kaiju:
  threads: 12
  level: "species"
  fmi: "/hdd0/susbus/databases/kaiju/kaiju_db_nr_euk.fmi"
  nodes: "/hdd0/susbus/databases/kaiju/nodes.dmp"
  names: "/hdd0/susbus/databases/kaiju/names.dmp"

struo2_kraken2:
  db: "/hdd0/susbus/databases/kraken2/"
  threads: 12

bracken:
  bin: "/hdd0/susbus/tools/Bracken/bracken"
  combine: "/hdd0/susbus/tools/Bracken/analysis_scripts/combine_bracken_outputs.py"

singlem:
  threads: 36
  db: "S3.2.1.GTDB_r214.metapackage_20231006.smpkg.zb"

# MEGAHIT
megahit:
  threads: 68
  coassembly_threads: 70

clumpify:
  threads: 64
  dupedist: 12000
  groups: 50
  memory: "1600g"

prodigal:
  threads: 12

eukulele:
  threads: 64
  db: "phylodb"
  aligner: "diamond"
  scratch: "/prj/DECODE/rehab/tmp/eukulele_scratch"
  ref_dir: "/hdd0/susbus/databases"

bwa:
  threads: 16
  map_threads: 24

samtools:
  sort:
    chunk_size: "4G"
    chunk_size_bigmem: "16G"

magiclamp:
  threads: 36

eggnog:
  db: "/hdd0/susbus/databases/eggnog"
  threads: 16
  final_threads: 24
  itype: "proteins"
  genepred: "prodigal"
  split:
    length: 2000000
    suffix: 3

seed:
  db: "/raid1/scratch/MEGshared/MG_packages/samsa2/full_databases"
  dmnd_db: "/raid1/scratch/MEGshared/MG_packages/samsa2/full_databases/subsys_db.dmnd"
  fa_db: "/raid1/scratch/MEGshared/MG_packages/samsa2/full_databases/subsys_db.fa"
  threads: 24

mmseqs2:
  threads: 72
  cov: 0.7
  min_id: 0.5
  cov_mode: 1

# AMR — core to REHAB (antibiotic resistance gene transmission study)
rgi:
  threads: 64
  db_url: "https://card.mcmaster.ca/latest/data"

filter_length:
  threads: 4

mdmcleaner:
  threads: 48

mapping:
  threads: 36

metabat2:
  threads: 56

concoct:
  threads: 64

metabinner:
  length: 2000
  threads: 64

semibin:
  threads: 64
  env: "wastewater"

dasTool:
  bin: "/hdd0/susbus/tools/DAS_Tool/DAS_Tool"
  threads: 64

checkm:
  threads: 64
  extension: "fa"
  git_path: "https://github.com/chklovski/CheckM2"

drep:
  threads: 64
  comp: 70
  cont: 16

gtdbtk:
  threads: 64
  path: "/hdd0/susbus/databases/gtdbtk/release214"

antismash:
  threads: 16

sylph:
  threads: 48
  gtdb_url: "http://faust.compbio.cs.cmu.edu/sylph-stuff/gtdb-r220-c200-dbv1.syldb"
  imgvr_url: "http://faust.compbio.cs.cmu.edu/sylph-stuff/imgvr_c200_v0.3.0.syldb"
  fundb_url: "http://faust.compbio.cs.cmu.edu/sylph-stuff/fungi-refseq-2024-07-25-c200-v0.3.syldb"

kegg_ids: "ko00521|ko00522|ko00523|ko00311|ko02611|ko01055|ko01051|ko00522"

############################################################
# BGC / AMR-marker / growth-rate step (workflow/rules/bgc_amr.smk)
# Adapted from SOCD's singlem_bgc_Snakefile_no_metadata. GECCO, BiG-SCAPE,
# and antiSMASH reuse pre-existing named conda envs on this host rather than
# being rebuilt via --use-conda.

# Curated KEGG KO -> antibiotic biosynthesis/resistance marker reference
abx_bgc:
  kegg_ref: "/prj/DECODE/rehab/resources/kegg_abx_bgc.txt"

gecco:
  bin: "/home/susbus/miniforge3/envs/gecco/bin/gecco"

seqkit:
  bin: "/home/susbus/miniforge3/bin/seqkit"

# antiSMASH run directly on per-sample assemblies (contrast with the
# rules/antismash.smk MAG-level run, which uses its own conda env)
antismash_assembly:
  bin: "/home/susbus/miniforge3/envs/antismash/bin/antismash"
  db: "/hdd0/susbus/databases"
  threads: 12
  # Minimum contig length fed to antiSMASH -- a real multi-gene BGC can't fit
  # intact on much shorter fragments, but hmmsearch cost scales with the
  # genes annotated on them regardless. See bgc_amr.smk for the SOCD
  # benchmarking notes this value is based on.
  min_contig_len: 2500

bigscape:
  bin: "/home/susbus/miniforge3/envs/bigscape/bin/bigscape"
  pfam_db: "/hdd0/susbus/databases/pfam/35.0/Pfam-A.hmm"
  threads: 64

# gRodon2 has no existing conda/native install on this host; runs via
# Singularity (image + temp files under work_dir/containers and work_dir/tmp)
grodon:
  image: "shengwei/grodon2:latest"

############################################################
# amrscan (workflow/rules/amrscan.smk) -- read-based AMR gene/variant
# detection via submodules/snake_amrscan (H.S. Gweon's resscan).
# The pre-existing 'amrscan' conda env has bwa/diamond/samtools but not
# pandas/numpy, so PATH is stitched with the base miniforge3 python (which
# has both) rather than rebuilding either environment.
amrscan:
  threads: 24
  db: "/prj/DECODE/salisbury_plain_results/snake_amrscan/resscan_CARD_v4.0.1"
  python_bin: "/home/susbus/miniforge3/bin/python"
  env_bin: "/prj/DECODE/conda_envs/amrscan/bin"
